name: HOL Plugin Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@8e2c4f37eb2703f037faf7abc1306b2a2e9c1b8d # v1.2.702
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          trust_repository_policy: true
          min_score: 80
          fail_on_severity: high
