name: Scorecard supply-chain security

# Results-only: no publish_results token needed. SARIF is uploaded as an
# artifact and to code scanning. Do not add the README badge until the first
# run lands on main.

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * 1"  # weekly, Mondays 02:00 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # for uploading SARIF to code scanning
      id-token: write        # for signing; publish_results stays false
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          publish_results: false
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
