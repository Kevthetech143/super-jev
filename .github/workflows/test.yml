name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm test
      - run: npm run demo
      - run: npm run demo -- --documents
      - run: npm run organize -- examples/organizer.json --demo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install pytest
      - run: npm run test:skill
      - run: python3 -m unittest discover -s experiments/verified-pointer-memory -p "test_*.py"
      - run: python3 experiments/verified-pointer-memory/stress.py
