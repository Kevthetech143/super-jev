name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run demo
      - run: npm run demo -- --documents
      - run: npm run organize -- examples/organizer.json --demo
