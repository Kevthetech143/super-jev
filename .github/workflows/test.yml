name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the documented floor; 3.x is whatever is newest
        python: ['3.10', '3.x']
    # Clearly fake caller settings, on purpose: the suites must give the same result whatever the
    # shell exports (test/clean-env.ts and skills/super-jev/tests/conftest.py clear them), and this
    # keeps that true on every push.
    env:
      TYPESAFE_API_KEY: not-a-real-key
      SUPERJEV_JUDGE: typesafe
      SUPERJEV_WRITER_COMMAND: 'false'
      SUPERJEV_GATE_CMD: 'false'
      SUPERJEV_VERIFY_CMD: 'false'
      SUPERJEV_AUTO_CACHE: '0'
      SWEEP_BATCH: '7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm test
      - run: npm run demo
      - run: npm run demo -- --documents
      - run: npm run organize -- examples/organizer.json --demo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # catches syntax newer than the floor in a .py file no test imports
      - run: python -m compileall -q skills
      - run: npm run test:skill
      - run: python3 -m pytest skills/super-jev-build-cycle/tests -q
      - run: python3 -m unittest discover -s experiments/verified-pointer-memory -p "test_*.py"
      - run: python3 experiments/verified-pointer-memory/stress.py

  # A stock Mac ships Python 3.9. setup.py is the one door that tells it how to get 3.10 or newer,
  # so it has to run there and print the steps, not die with a traceback.
  setup-on-python-3-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - run: |
          rc=0
          python3 skills/super-jev/setup.py > setup-out.txt || rc=$?
          cat setup-out.txt
          test "$rc" -eq 1
          grep -qF 'uv python install 3.12 --default' setup-out.txt
