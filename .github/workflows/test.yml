name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run demo
      - run: npm run demo -- --documents
      - run: npm run organize -- examples/organizer.json --demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pytest
      - run: npm run test:skill
      - run: python3 -m unittest discover -s experiments/verified-pointer-memory -p "test_*.py"
      - run: python3 experiments/verified-pointer-memory/stress.py
